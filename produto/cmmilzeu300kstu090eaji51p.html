            } else {
                alert('Erro ao obter o QR Code do PIX. Tente novamente.');
            }
        } catch(err) {
            console.error('Erro PUFPAG:', err);
            alert('Erro de conexão ao gerar PIX.');
        }
    }
}, true);
</script>
